<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vpsctl 管理台</title>
<style>
:root {
  --bg: #12151f; --panel: #1a1f2e; --line: #2a3147; --fg: #dfe4f2; --dim: #8a93ad;
  --accent: #4f8cff; --danger: #e5484d; --warn: #eaa64d; --ok: #46c46f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 20px;
  border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { font-size: 18px; margin: 0; }
h1 .sub { color: var(--dim); font-size: 12px; font-weight: normal; margin-left: 6px; }
#summary { color: var(--dim); flex: 1; }
button { background: #242b40; color: var(--fg); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .4; cursor: default; }
button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
button.warn { background: var(--warn); border-color: var(--warn); color: #1c1608; }
button.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 12px 0; }
.form-grid label { display: flex; flex-direction: column; gap: 4px; color: var(--dim); font-size: 12px; }
.form-grid select, .form-grid input { background: var(--bg); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
#cr-keys { max-height: 110px; overflow: auto; background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
  font-size: 13px; margin-top: 4px; }
#cr-keys .keyrow { display: block; margin: 2px 0; }
.filters { display: flex; gap: 8px; padding: 12px 20px 0; flex-wrap: wrap; }
.filters input, .filters select { background: var(--panel); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.filters input { width: 220px; }
.toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 20px; }
#selinfo { color: var(--dim); margin-right: auto; }
table { border-collapse: collapse; width: calc(100% - 40px); margin: 0 20px 30px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--dim); font-weight: normal; font-size: 12px; }
tbody tr:hover { background: #1c2233; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
.status { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
.status.active { background: #173a24; color: var(--ok); }
.status.new { background: #16283f; color: var(--accent); }
.status.off { background: #2b2f3d; color: var(--dim); }
.status.other { background: #3d2f16; color: var(--warn); }
.tag { display: inline-block; background: #232a3f; border-radius: 4px;
  padding: 0 6px; margin-right: 4px; font-size: 12px; color: var(--dim); }
#banner { display: none; margin: 0 20px 12px; padding: 10px 14px; border-radius: 6px;
  background: #3a2225; color: #f2b8bb; white-space: pre-wrap; }
#banner.show { display: block; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55);
  display: flex; align-items: center; justify-content: center; }
.overlay[hidden] { display: none; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 22px 26px; width: min(560px, 92vw); }
.modal h2 { margin: 0 0 10px; font-size: 16px; }
.modal .dellist { max-height: 180px; overflow: auto; background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; margin: 8px 0;
  font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.modal .cost { color: var(--warn); }
.modal .opt { display: block; margin: 10px 0; }
.modal input { background: var(--bg); color: var(--fg); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
#toast { position: fixed; right: 20px; bottom: 20px; background: #173a24; color: var(--ok);
  padding: 10px 16px; border-radius: 6px; opacity: 0; transition: opacity .3s; pointer-events: none; }
#toast.show { opacity: 1; }
.empty { color: var(--dim); text-align: center; padding: 30px 0; }
</style>
</head>
<body>
<header>
  <h1>vpsctl<span class="sub">本地管理台（多账号聚合）</span></h1>
  <div id="summary">加载中…</div>
  <button id="refresh">刷新</button>
</header>

<div class="filters">
  <input id="q" placeholder="搜索名称 / IP / 标签…">
  <select id="f-account"><option value="">全部账号</option></select>
  <select id="f-region"><option value="">全部区域</option></select>
  <select id="f-status">
    <option value="">全部状态</option>
    <option value="active">active</option>
    <option value="new">new</option>
    <option value="off">off</option>
  </select>
  <input id="f-tag" placeholder="标签过滤，如 batch:202609…" style="width:180px">
</div>

<div class="toolbar">
  <span id="selinfo">未选择</span>
  <button id="btn-create">创建节点…</button>
  <button id="btn-poweroff" class="warn" disabled>关机</button>
  <button id="btn-poweron" disabled>开机</button>
  <button id="btn-delete" class="danger" disabled>删除…</button>
</div>

<div id="banner"></div>

<table>
  <thead><tr>
    <th><input type="checkbox" id="selall"></th>
    <th>名称</th><th>状态</th><th>区域</th><th>套餐</th><th>配置</th>
    <th>公网 IPv4</th><th>月费</th><th>标签</th><th>账号</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>

<div class="overlay" id="modal-del" hidden>
  <div class="modal">
    <h2>确认彻底删除</h2>
    <p>删除即<b style="color:var(--danger)">销毁磁盘、停止计费、不可恢复</b>。
      共 <b id="del-count">0</b> 台，释放月费 $<span id="del-cost">0.00</span>：</p>
    <div class="dellist" id="del-list"></div>
    <label class="opt"><input type="checkbox" id="del-shutdown">
      先优雅关机再删除（关机未完成则不删，宁可漏删）</label>
    <p>请输入所选台数 <b id="del-need">0</b> 以确认：<input id="del-input" size="4" inputmode="numeric" autocomplete="off"></p>
    <div class="modal-actions">
      <button id="del-cancel">取消</button>
      <button id="del-confirm" class="danger" disabled>彻底删除</button>
    </div>
  </div>
</div>

<div class="overlay" id="modal-create" hidden>
  <div class="modal">
    <h2>创建节点</h2>
    <div class="form-grid">
      <label>账号
        <select id="cr-account"></select>
      </label>
      <label>台数（1-50）
        <input id="cr-count" type="number" min="1" max="50" value="1">
      </label>
      <label>区域
        <select id="cr-region"></select>
      </label>
      <label>套餐
        <select id="cr-size"></select>
      </label>
      <label>镜像
        <select id="cr-image"></select>
      </label>
      <label>命名前缀（自动续号防重名）
        <input id="cr-prefix" value="vps">
      </label>
    </div>
    <label style="color:var(--dim);font-size:12px">SSH 公钥（不勾选则不带公钥创建）</label>
    <div id="cr-keys"></div>
    <p id="cr-est" class="cost" style="margin:10px 0 0"></p>
    <p id="cr-msg" style="color:var(--dim);font-size:12px;margin:6px 0 0"></p>
    <div class="modal-actions">
      <button id="cr-cancel">取消</button>
      <button id="cr-submit" class="accent">创建</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let droplets = [], acctErrors = [];
const selected = new Set();  // "account/id"
let toastTimer = null;

const key = d => d.account + '/' + d.id;

async function load() {
  try {
    const r = await fetch('/api/droplets');
    const j = await r.json();
    droplets = j.droplets || [];
    acctErrors = j.errors || [];
    render();
  } catch (e) { banner('加载失败: ' + e, true); }
}

function filtered() {
  const q = $('q').value.trim().toLowerCase();
  const acc = $('f-account').value, reg = $('f-region').value, st = $('f-status').value;
  const tag = $('f-tag').value.trim().toLowerCase();
  return droplets.filter(d =>
    (!acc || d.account === acc) && (!reg || d.region === reg) && (!st || d.status === st) &&
    (!tag || (d.tags || []).some(t => t.toLowerCase().includes(tag))) &&
    (!q || [d.name, d.ipv4_public, ...(d.tags || [])].join(' ').toLowerCase().includes(q)));
}

function fillSelect(id, values) {
  const el = $(id), cur = el.value;
  el.textContent = '';
  el.append(new Option(el.id === 'f-account' ? '全部账号' : '全部区域', ''));
  values.sort().forEach(v => el.append(new Option(v, v)));
  el.value = values.includes(cur) ? cur : '';
}

function cell(text, cls) {
  const td = document.createElement('td');
  if (cls) td.className = cls;
  td.textContent = (text === undefined || text === null || text === '') ? '—' : text;
  return td;
}

function statusCell(s) {
  const td = document.createElement('td');
  const sp = document.createElement('span');
  sp.className = 'status ' + (['active', 'new', 'off'].includes(s) ? s : 'other');
  sp.textContent = s;
  td.append(sp);
  return td;
}

function render() {
  fillSelect('f-account', [...new Set(droplets.map(d => d.account))]);
  fillSelect('f-region', [...new Set(droplets.map(d => d.region || ''))].filter(Boolean));

  const total = droplets.reduce((s, d) => s + (d.price_monthly || 0), 0);
  $('summary').textContent = `${droplets.length} 台节点 · 合计月费 $${total.toFixed(2)}`
    + (acctErrors.length ? ` · ${acctErrors.length} 个账号查询失败` : '');

  const list = filtered();
  const rows = $('rows');
  rows.textContent = '';
  if (!list.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 10; td.className = 'empty';
    td.textContent = droplets.length ? '没有匹配当前过滤条件的节点' : '没有节点';
    tr.append(td); rows.append(tr);
  }
  for (const d of list) {
    const tr = document.createElement('tr');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = selected.has(key(d));
    cb.onchange = () => { cb.checked ? selected.add(key(d)) : selected.delete(key(d)); updateBar(list); };
    const tdCb = document.createElement('td'); tdCb.append(cb); tr.append(tdCb);
    tr.append(cell(d.name, 'mono'));
    tr.append(statusCell(d.status));
    tr.append(cell(d.region));
    tr.append(cell(d.size));
    tr.append(cell(d.vcpus ? `${d.vcpus}C/${(d.memory_mb / 1024).toFixed(1)}G` : '—'));
    tr.append(cell(d.ipv4_public, 'mono'));
    tr.append(cell(d.price_monthly ? '$' + d.price_monthly.toFixed(2) : '—'));
    const tdTags = document.createElement('td');
    for (const t of d.tags || []) {
      const s = document.createElement('span'); s.className = 'tag'; s.textContent = t; tdTags.append(s);
    }
    tr.append(tdTags);
    tr.append(cell(d.account));
    rows.append(tr);
  }
  $('selall').checked = list.length > 0 && list.every(d => selected.has(key(d)));
  updateBar(list);
}

function selDroplets() { return droplets.filter(d => selected.has(key(d))); }

function updateBar(list) {
  const n = selected.size;
  $('selinfo').textContent = n ? `已选 ${n} 台 · 月费 $${selDroplets().reduce((s, d) => s + (d.price_monthly || 0), 0).toFixed(2)}` : '未选择';
  for (const id of ['btn-poweroff', 'btn-poweron', 'btn-delete']) $(id).disabled = !n;
  $('selall').checked = list && list.length > 0 && list.every(d => selected.has(key(d)));
}

function banner(msg, show) {
  const b = $('banner');
  b.textContent = msg;
  b.className = show ? 'show' : '';
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = ''), 3000);
}

async function postOp(url, body) {
  try {
    const r = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (!r.ok) { banner('操作失败: ' + (j.error || r.status), true); return; }
    const fails = (j.results || []).filter(x => !x.ok);
    if (!fails.length) toast(`操作已提交，全部成功（${j.results.length} 台）`);
    else banner(`成功 ${j.results.length - fails.length} 台，失败 ${fails.length} 台：\n`
      + fails.map(f => `${f.account}/${f.id} ${f.error}`).join('\n'), true);
  } catch (e) { banner('请求失败: ' + e, true); }
  await load();
}

async function power(action) {
  const ds = selDroplets();
  const label = action === 'power_off' ? '关机' : '开机';
  if (!ds.length || !confirm(`确认对已选 ${ds.length} 台执行「${label}」？`)) return;
  await postOp('/api/power', { action, targets: ds.map(d => ({ account: d.account, id: d.id })) });
}

function openDelete() {
  const ds = selDroplets();
  if (!ds.length) return;
  $('del-count').textContent = ds.length;
  $('del-need').textContent = ds.length;
  $('del-cost').textContent = ds.reduce((s, d) => s + (d.price_monthly || 0), 0).toFixed(2);
  const lst = $('del-list');
  lst.textContent = '';
  ds.forEach(d => {
    const div = document.createElement('div');
    div.textContent = `${d.name}  (${d.account} / ${d.ipv4_public || '无 IP'})`;
    lst.append(div);
  });
  $('del-input').value = '';
  $('del-confirm').disabled = true;
  $('modal-del').hidden = false;
  $('del-input').focus();
}

$('refresh').onclick = load;
['q', 'f-account', 'f-region', 'f-status', 'f-tag'].forEach(id => $(id).oninput = render);
$('btn-poweroff').onclick = () => power('power_off');
$('btn-poweron').onclick = () => power('power_on');
$('btn-delete').onclick = openDelete;
$('selall').onchange = e => {
  filtered().forEach(d => e.target.checked ? selected.add(key(d)) : selected.delete(key(d)));
  render();
};
$('del-input').oninput = e => {
  $('del-confirm').disabled = e.target.value.trim() !== String(selDroplets().length);
};
$('del-cancel').onclick = () => ($('modal-del').hidden = true);
$('del-confirm').onclick = async () => {
  const ds = selDroplets();
  const shutdownFirst = $('del-shutdown').checked;
  $('modal-del').hidden = true;
  await postOp('/api/delete', {
    targets: ds.map(d => ({ account: d.account, id: d.id })),
    count: ds.length,
    shutdown_first: shutdownFirst,
  });
  selected.clear();
  render();
};

/* ---- 创建节点 ---- */
let catalog = null;

async function openCreate() {
  $('modal-create').hidden = false;
  $('cr-msg').textContent = '';
  try {
    const r = await fetch('/api/catalog');
    catalog = await r.json();
  } catch (e) { $('cr-msg').textContent = '加载账号失败: ' + e; return; }
  const sel = $('cr-account'), cur = sel.value;
  sel.textContent = '';
  (catalog.accounts || []).forEach(a => sel.append(new Option(a, a)));
  if ((catalog.accounts || []).includes(cur)) sel.value = cur;
  await loadCatalogFor(sel.value);
}

async function loadCatalogFor(acct) {
  if (!acct) return;
  $('cr-msg').textContent = '加载可选值…（首次约数秒）';
  try {
    const r = await fetch('/api/catalog?account=' + encodeURIComponent(acct));
    const j = await r.json();
    if (!r.ok) { $('cr-msg').textContent = '失败: ' + (j.error || r.status); return; }
    catalog = Object.assign(catalog || {}, j);
  } catch (e) { $('cr-msg').textContent = '请求失败: ' + e; return; }
  const c = catalog;

  const rsel = $('cr-region');
  rsel.textContent = '';
  (c.regions || []).forEach(g => rsel.append(new Option(g.slug + ' · ' + g.name, g.slug)));

  const ssel = $('cr-size');
  ssel.textContent = '';
  (c.sizes || []).slice().sort((a, b) => a.price_monthly - b.price_monthly)
    .forEach(s => ssel.append(new Option(
      `${s.slug} · ${s.vcpus}C/${(s.memory_mb / 1024).toFixed(1)}G/${s.disk_gb}G · $${s.price_monthly}/mo`, s.slug)));

  const isel = $('cr-image');
  isel.textContent = '';
  const groups = {};
  (c.images || []).forEach(im => {
    const d = im.distribution || '其他';
    (groups[d] = groups[d] || []).push(im);
  });
  Object.keys(groups).sort().forEach(dist => {
    const og = document.createElement('optgroup');
    og.label = dist;
    groups[dist].forEach(im => og.append(new Option(im.slug, im.slug)));
    isel.append(og);
  });

  const kd = $('cr-keys');
  kd.textContent = '';
  (c.keys || []).forEach(k => {
    const l = document.createElement('label');
    l.className = 'keyrow';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = true; cb.value = k.id || k.fingerprint;
    l.append(cb, document.createTextNode(` ${k.name}（${k.fingerprint || k.id}）`));
    kd.append(l);
  });
  if (!(c.keys || []).length) kd.textContent = '该账号没有 SSH 公钥，将不带公钥创建';

  if (Object.keys(c.errors || {}).length) {
    $('cr-msg').textContent = '部分可选值加载失败: ' + JSON.stringify(c.errors);
  } else {
    $('cr-msg').textContent = '';
  }
  updateEstimate();
}

function updateEstimate() {
  const sizes = (catalog && catalog.sizes) || [];
  const size = sizes.find(s => s.slug === $('cr-size').value);
  const n = parseInt($('cr-count').value || '1', 10);
  $('cr-est').textContent = size
    ? `预计月费：$${(size.price_monthly * n).toFixed(2)}（$${size.price_monthly.toFixed(2)}/mo × ${n} 台）`
    : '';
  $('cr-submit').disabled = !($('cr-account').value && $('cr-region').value
    && $('cr-size').value && $('cr-image').value && n >= 1);
}

$('btn-create').onclick = openCreate;
$('cr-account').onchange = () => loadCatalogFor($('cr-account').value);
$('cr-size').onchange = updateEstimate;
$('cr-count').oninput = updateEstimate;
$('cr-cancel').onclick = () => ($('modal-create').hidden = true);
$('cr-submit').onclick = async () => {
  const keys = [...document.querySelectorAll('#cr-keys input:checked')].map(cb => cb.value);
  const body = {
    account: $('cr-account').value,
    count: parseInt($('cr-count').value || '1', 10),
    region: $('cr-region').value,
    size: $('cr-size').value,
    image: $('cr-image').value,
    ssh_keys: keys,
    prefix: $('cr-prefix').value || 'vps',
  };
  $('cr-submit').disabled = true;
  $('cr-msg').textContent = '提交中…';
  try {
    const r = await fetch('/api/create', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (!r.ok) { $('cr-msg').textContent = '失败: ' + (j.error || r.status); return; }
    $('modal-create').hidden = true;
    const fails = j.errors || [];
    if (!fails.length) toast(`已提交创建 ${j.created.length} 台，列表稍后自动刷新可见`);
    else banner(`成功 ${j.created.length} 台，失败 ${fails.length} 台：\n`
      + fails.map(e => `${e.name}: ${e.error}`).join('\n'), true);
    await load();
  } catch (e) {
    $('cr-msg').textContent = '请求失败: ' + e;
  } finally {
    updateEstimate();
  }
};

load();
setInterval(() => { if ($('modal-del').hidden) load(); }, 30000);
</script>
</body>
</html>
